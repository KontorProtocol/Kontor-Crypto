name: Formal Picus (Determinism)

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    # Nightly (UTC). Adjust as needed.
    - cron: "0 6 * * *"

concurrency:
  group: formal-picus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full_matrix:
    runs-on: ubuntu-x86-8cpu
    timeout-minutes: 60
    env:
      # Pin Picus Docker image digest for determinism.
      PICUS_DOCKER_IMAGE: >-
        veridise/picus:base@sha256:fc396dbabd92cb0026a52dd3f2f72893374a1fc29367409cb49f251923089162
      PICUS_DOCKER_PLATFORM: linux/amd64
      # Keep within GitHub hosted runner memory constraints.
      PICUS_DOCKER_MEMORY: 6g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Picus (Pinned)
        uses: actions/checkout@v4
        with:
          repository: Veridise/Picus
          # Pinned commit for determinism (Veridise/Picus main @ 2026-02-13).
          ref: 138b151d3a388e5b6c040c163e0a1db04f2ceda6
          path: Picus

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: >-
            ${{ runner.os }}-cargo-formal-picus-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-formal-picus-

      - name: Docker Info
        run: |
          docker version
          docker info

      - name: Pull Picus Image
        run: docker pull "${PICUS_DOCKER_IMAGE}"

      - name: Run Picus Full Fixture Matrix (Leaf+Path Scope)
        env:
          # Ensure the container runs the pinned Picus checkout.
          PICUS_SOURCE_DIR: ${{ github.workspace }}/Picus
        run: |
          cargo run --release --bin picus_verify -- \
            --all \
            --picus-bin tools/picus/run-picus-docker.sh \
            --solver cvc5 \
            --picus-log-level PROGRESS \
            --timeout-secs 1200 \
            --hard-timeout-grace-secs 120 \
            --output-prefix-len 2 \
            --picus-leafpath-precondition

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-picus-artifacts
          path: |
            artifacts/picus/summary.json
            artifacts/picus/summary.md
            artifacts/picus/*/picus-result.json
            artifacts/picus/*/export-metadata.json
            artifacts/picus/*/circuit*.r1cs
            artifacts/picus/*/circuit*.sym
            artifacts/picus/*/picus-precondition.json

