name: Formal Picus (Comprehensive)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    # Nightly (UTC). Adjust as needed.
    - cron: "0 6 * * *"

concurrency:
  group: formal-picus-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  picus_matrix:
    name: Picus ${{ matrix.lane_name }}
    runs-on: ubuntu-latest-m
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane_name: Component Blocking Matrix
            manifest: tools/picus/components/manifest.json
            fixtures_dir: tools/picus/components/fixtures
            artifacts_dir: artifacts/picus-components
            artifact_name: formal-picus-components-artifacts
            extra_args: --timeout-secs 1200 --hard-timeout-grace-secs 120
          - lane_name: Monolithic Broad Matrix
            manifest: tools/picus/manifest-broad.json
            fixtures_dir: tools/picus/fixtures
            artifacts_dir: artifacts/picus-monolithic
            artifact_name: formal-picus-monolithic-artifacts
            extra_args: ""
    env:
      # Pin Picus Docker image digest for determinism.
      PICUS_DOCKER_IMAGE: >-
        veridise/picus:base@sha256:fc396dbabd92cb0026a52dd3f2f72893374a1fc29367409cb49f251923089162
      PICUS_DOCKER_PLATFORM: linux/amd64
      # Keep within GitHub hosted runner memory constraints while avoiding solver OOM.
      PICUS_DOCKER_MEMORY: 10g
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout Picus (Pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Veridise/Picus
          # Pinned commit for determinism (Veridise/Picus main @ 2026-02-13).
          ref: 138b151d3a388e5b6c040c163e0a1db04f2ceda6
          path: Picus

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: >-
            ${{ runner.os }}-cargo-formal-picus-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-formal-picus-

      - name: Install z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

      - name: Docker Info
        run: |
          docker version
          docker info

      - name: Pull Picus Image
        run: docker pull "${PICUS_DOCKER_IMAGE}"

      - name: Run Picus Matrix Lane (Fail Closed)
        env:
          # Ensure the container runs the pinned Picus checkout.
          PICUS_SOURCE_DIR: ${{ github.workspace }}/Picus
        run: |
          cargo run --release --bin picus_verify -- \
            --all \
            --manifest "${{ matrix.manifest }}" \
            --fixtures-dir "${{ matrix.fixtures_dir }}" \
            --artifacts-dir "${{ matrix.artifacts_dir }}" \
            --picus-bin tools/picus/run-picus-docker.sh \
            --solver cvc5 \
            --picus-log-level PROGRESS \
            --scope leafpath \
            --simplify safe \
            ${{ matrix.extra_args }}

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifacts_dir }}/summary.json
            ${{ matrix.artifacts_dir }}/summary.md
            ${{ matrix.artifacts_dir }}/*/picus-result*.json
            ${{ matrix.artifacts_dir }}/*/export-metadata.json
            ${{ matrix.artifacts_dir }}/*/circuit*.r1cs
            ${{ matrix.artifacts_dir }}/*/circuit*.sym
            ${{ matrix.artifacts_dir }}/*/picus-precondition.json
