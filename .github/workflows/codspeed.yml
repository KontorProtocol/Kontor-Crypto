name: CodSpeed Performance Monitoring

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # Allow manual triggers for baseline generation

permissions:
  contents: read

jobs:
  benchmarks:
    name: Benchmarks (${{ matrix.shard }})
    runs-on: codspeed-macro
    timeout-minutes: 600
    strategy:
      fail-fast: false
      matrix:
        shard:
          - primitives
          - file_preparation
          - proving
          - verification

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        run: rustup show

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          cache-on-failure: true
          shared-key: "benchmarks-${{ runner.arch }}"

      - name: Prepare CodSpeed tooling
        run: |
          cargo install cargo-codspeed --locked
          cargo codspeed build -m walltime

      - name: Run benchmarks with CodSpeed
        # v4.10.6 pinned to commit for supply-chain safety
        uses: CodSpeedHQ/action@568631e981ca53efe0331925d2a3c8e5d53ab6e5
        with:
          mode: walltime
          run: cargo codspeed run -- ${{ matrix.shard }}
