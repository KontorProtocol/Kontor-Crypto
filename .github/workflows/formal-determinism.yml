name: Formal Determinism (Picus)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  full_matrix:
    if: ${{ vars.ENABLE_FORMAL_PICUS_FULL == 'true' }}
    runs-on: ubuntu-x86-8cpu
    timeout-minutes: 120
    env:
      PICUS_R1CS_CONVERTER_BIN: ${{ vars.PICUS_R1CS_CONVERTER_BIN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-formal-full-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-formal-full-

      - name: Install Picus
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "git+https://github.com/Veridise/Picus.git@v2.2.0"

      - name: Run full fixture matrix
        run: |
          cargo run --bin picus_verify -- --all --timeout-secs 900

      - name: Upload formal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: picus-artifacts
          path: |
            artifacts/picus/summary.json
            artifacts/picus/summary.md
            artifacts/picus/*/export-metadata.json
            artifacts/picus/*/picus-result.json
