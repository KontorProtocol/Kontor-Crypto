name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        run: rustup show

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify crate versions match release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          EXPECTED="${RELEASE_TAG#v}"
          if [ -z "$EXPECTED" ]; then
            echo "::error::Release tag is empty"
            exit 1
          fi
          fail=0
          for crate in kontor-crypto-core kontor-crypto kontor-crypto-wasm; do
            ACTUAL=$(cargo metadata --format-version 1 --no-deps \
              | jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::$crate version is '$ACTUAL' but release tag is '$RELEASE_TAG' (expected '$EXPECTED')"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]

      - name: Publish kontor-crypto-core
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "kontor-crypto-core") | .version')
          if curl -sSfL -A "kontor-crypto-release-workflow (github.com/${{ github.repository }})" \
              "https://index.crates.io/ko/nt/kontor-crypto-core" \
              | jq -e --arg v "$VERSION" 'select(.vers == $v)' >/dev/null 2>&1; then
            echo "kontor-crypto-core@$VERSION already published, skipping."
            exit 0
          fi
          cargo publish -p kontor-crypto-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io to index kontor-crypto-core
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "kontor-crypto-core") | .version')
          echo "Waiting for kontor-crypto-core@$VERSION to appear on crates.io..."
          for i in $(seq 1 30); do
            if curl -sSfL -A "kontor-crypto-release-workflow (github.com/${{ github.repository }})" \
                "https://index.crates.io/ko/nt/kontor-crypto-core" \
                | jq -e --arg v "$VERSION" 'select(.vers == $v)' >/dev/null 2>&1; then
              echo "kontor-crypto-core@$VERSION is indexed"
              exit 0
            fi
            echo "  attempt $i/30 — retrying in 10s..."
            sleep 10
          done
          echo "::error::Timed out waiting for crates.io to index kontor-crypto-core@$VERSION"
          exit 1

      - name: Publish kontor-crypto
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "kontor-crypto") | .version')
          if curl -sSfL -A "kontor-crypto-release-workflow (github.com/${{ github.repository }})" \
              "https://index.crates.io/ko/nt/kontor-crypto" \
              | jq -e --arg v "$VERSION" 'select(.vers == $v)' >/dev/null 2>&1; then
            echo "kontor-crypto@$VERSION already published, skipping."
            exit 0
          fi
          cargo publish -p kontor-crypto
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: publish-crates
    runs-on: ubuntu-latest-m
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        run: rustup show

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null; then
            cargo install wasm-pack --locked --version 0.14.0
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Show npm version
        run: npm --version

      - name: Verify npm package version matches release tag
        working-directory: packages/kontor-crypto
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          EXPECTED="${RELEASE_TAG#v}"
          ACTUAL=$(jq -r '.version' package.json)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::package.json version is '$ACTUAL' but release tag is '$RELEASE_TAG' (expected '$EXPECTED')"
            exit 1
          fi

      - name: Build package
        working-directory: packages/kontor-crypto
        run: |
          npm ci
          npm run build

      - name: Publish to npm
        working-directory: packages/kontor-crypto
        run: |
          NAME=$(jq -r '.name' package.json)
          VERSION=$(jq -r '.version' package.json)
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published, skipping."
            exit 0
          fi
          npm publish --access public
