name: Security Mutation Testing (Non-Blocking)

on:
  workflow_dispatch:
  schedule:
    # Monthly, 1st day 04:00 UTC
    - cron: "0 4 1 * *"

permissions:
  contents: read

concurrency:
  group: security-mutation-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  mutants:
    name: cargo-mutants (limited)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@881ba7bf39a41cda34ac9e123fb41b44ed08232f
        with:
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install cargo-mutants
        run: |
          if ! command -v cargo-mutants >/dev/null; then
            cargo install cargo-mutants --locked
          fi

      - name: Run mutation tests (bounded)
        run: |
          # Keep this non-blocking: bounded time, no artifacts.
          cargo mutants --workspace --all-features --timeout 180

