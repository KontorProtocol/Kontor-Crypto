[package]
name = "kontor-crypto-core"
version = "0.1.0"
edition = "2021"
description = "Shared cryptographic primitives for Kontor PoR (prepare_file, encode, Merkle)"

[features]
default = []
# Use Nova's Poseidon (same constants) so regression tests core vs Nova pass. For test/dev only.
nova_poseidon = ["nova-snark", "generic-array"]

# Dependency version pins:
# - blake2b_simd and constant_time_eq: pinned to avoid edition2024 crates
#   (blake2b_simd 1.0.4+ pulls constant_time_eq 0.4.2+ which requires edition2024).
[dependencies]
ff = "0.13"
nova-snark = { version = "0.41.0", optional = true, default-features = false }
generic-array = { version = "0.14", optional = true }
sha2 = "0.10.6"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
halo2curves = { version = "0.8", default-features = false, features = ["derive_serde"] }
reed-solomon-erasure = "6.0"
# Pin to avoid constant_time_eq 0.4.2 (edition2024) from blake2b_simd 1.0.4
blake2b_simd = "1.0.1"
constant_time_eq = "0.3.1"
once_cell = "1.19"
