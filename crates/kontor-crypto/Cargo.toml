[package]
name = "kontor-crypto"
version = "0.2.0"
edition = "2021"
default-run = "kontor-crypto"
license = "MIT"
description = "Kontor Proof-of-Retrievability system for decentralized storage"
repository = "https://github.com/KontorProtocol/Kontor-Crypto"
homepage = "https://github.com/KontorProtocol/Kontor-Crypto"
keywords = ["cryptography", "snark", "por", "storage", "zero-knowledge"]
categories = ["cryptography", "algorithms"]
readme = "../../README.md"
autobenches = false
exclude = [
    ".github/",
    ".githooks/",
    ".claude/",
    "target/",
]

[dependencies]
# --- Core SNARK and Proof System Dependencies ---

nova-snark = { version = "0.41.0", default-features = false }
kontor-crypto-core = { path = "../kontor-crypto-core", version = "0.2.0", features = ["nova_poseidon"] }

# --- Hashing and Merkle Tree Dependencies ---

ff = "0.13"
sha2 = "0.10.6"
generic-array = "0.14.7"


# --- Application and Tooling Dependencies ---

# Foundational libraries for serialization, CLI, and randomness.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
clap = { version = "4.0", features = ["derive"] }
rand = "0.8.5"
once_cell = "1.19.0"
thiserror = "1.0"
libc = "0.2"
num-bigint = "0.4"

# --- Observability & CLI Progress ---
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tracing-tree = "0.3"
peak_alloc = { version = "0.2", optional = true }

# Dependency version pins:
# Pin: nova-snark -> halo2curves -> blake2b_simd 1.0.4+ -> constant_time_eq 0.4.2+
# (edition2024, requires rustc 1.85+). Pin blake2b_simd <= 1.0.3 to stay safe.
constant_time_eq = "0.3.1"
blake2b_simd = "1.0.1"

[dev-dependencies]
clap = { version = "4.5.10", features = ["derive"] }
rand = "0.8.5"
statrs = "0.18.0"
divan = { version = "4.1", package = "codspeed-divan-compat" }
tempfile = "3"

[features]
default = []
memory-profiling = ["peak_alloc"]
bench-smoke = []
# Dev-only formal verification helpers (toy/lite circuits, convergence experiments).
# Off by default to keep the production build surface minimal.
formal-dev = []

# Documentation configuration for docs.rs
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[[bench]]
name = "bench_main"
harness = false
